name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint et formatage (Biome)
        run: npm run lint
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Tests du moteur
        run: npm test
      - name: Build
        run: npx vite build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout (mobile et ordinateur)
        run: npm run test:e2e
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
